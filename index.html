<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Icy Climb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" width="480" height="640" aria-label="Icy Climb game"></canvas>
  </main>

  <div id="touch" aria-hidden="true">
    <button id="btnLeft" data-key="left">&#9664;</button>
    <button id="btnRight" data-key="right">&#9654;</button>
    <button id="btnJump" data-key="jump">JUMP</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
